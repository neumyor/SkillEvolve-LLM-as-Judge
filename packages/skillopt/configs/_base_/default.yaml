# SkillOpt default configuration — base for all environments.
# Environment configs should inherit via: _base_: default.yaml

model:
  backend: azure_openai
  optimizer: gpt-5.5
  target: gpt-5.5
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: medium
  rewrite_reasoning_effort: ""
  rewrite_max_completion_tokens: 64000
  codex_exec_path: ""       # blank preserves CODEX_EXEC_PATH or the built-in default
  codex_exec_sandbox: ""    # blank preserves CODEX_EXEC_SANDBOX or workspace-write
  codex_exec_profile: ""
  codex_exec_reasoning_effort: ""
  codex_exec_use_sdk: null
  codex_exec_network_access: null
  codex_exec_web_search: null
  codex_exec_approval_policy: ""
  claude_code_exec_path: claude
  claude_code_exec_profile: ""
  claude_code_exec_use_sdk: auto
  claude_code_exec_effort: medium
  claude_code_exec_max_thinking_tokens: 16384
  cursor_exec_path: ""       # blank uses CURSOR_EXEC_PATH or cursor-agent
  cursor_exec_sandbox: ""    # blank uses CURSOR_EXEC_SANDBOX or enabled
  # GitHub Copilot CLI. `--backend copilot` selects copilot_chat for BOTH roles,
  # using CLI authentication rather than a separate provider API key.
  copilot_exec_path: ""              # blank uses COPILOT_EXEC_PATH or copilot
  copilot_exec_home: ""              # blank leaves COPILOT_HOME untouched
  # null preserves COPILOT_EXEC_ALLOW_ALL_TOOLS (default off); copilot_exec only
  copilot_exec_allow_all_tools: null  # required for file-edit rollouts
  copilot_chat_optimizer_model: ""   # blank lets the CLI pick its default model
  copilot_chat_target_model: ""
  copilot_chat_timeout: null         # preserves COPILOT_CHAT_TIMEOUT or the built-in default
  codex_trace_to_optimizer: true
  claude_trace_to_optimizer: true
  azure_openai_endpoint: ""           # e.g. "https://your-resource.openai.azure.com/"
  azure_openai_api_version: "2024-12-01-preview"
  azure_openai_api_key: ""       # Fill locally if you do not export AZURE_OPENAI_API_KEY
  azure_openai_auth_mode: ""           # empty → fall back to AZURE_OPENAI_AUTH_MODE env (default "azure_cli")
  azure_openai_ad_scope: "https://cognitiveservices.azure.com/.default"
  azure_openai_managed_identity_client_id: ""
  optimizer_azure_openai_endpoint: ""   # e.g. "https://your-resource.openai.azure.com/"
  optimizer_azure_openai_api_version: "2024-12-01-preview"
  optimizer_azure_openai_api_key: ""
  optimizer_azure_openai_auth_mode: ""           # empty → fall back to OPTIMIZER_AZURE_OPENAI_AUTH_MODE env, then shared
  optimizer_azure_openai_ad_scope: "https://cognitiveservices.azure.com/.default"
  optimizer_azure_openai_managed_identity_client_id: ""
  target_azure_openai_endpoint: ""   # e.g. "https://your-resource.openai.azure.com/"
  target_azure_openai_api_version: "2024-12-01-preview"
  target_azure_openai_api_key: ""
  target_azure_openai_auth_mode: ""           # empty → fall back to TARGET_AZURE_OPENAI_AUTH_MODE env, then shared
  target_azure_openai_ad_scope: "https://cognitiveservices.azure.com/.default"
  target_azure_openai_managed_identity_client_id: ""

  # Qwen backend settings (qwen_chat roles). `chat_template_kwargs` is a
  # vLLM/SGLang extension that OpenAI/Azure reject, so the wire policy is
  # explicit: server_default omits the key (safe default), enabled/disabled
  # send it. Pin "disabled" to reproduce the published non-thinking numbers.
  qwen_chat_thinking_mode: ""            # server_default (default) | enabled | disabled
  optimizer_qwen_chat_thinking_mode: ""  # per-role override
  target_qwen_chat_thinking_mode: ""     # per-role override

  # MiniMax backend settings (minimax_chat target)
  minimax_region: ""            # global_en (default) or cn_zh; selects the base URL
  minimax_base_url: ""          # region base URL if blank
  minimax_api_key: ""
  minimax_model: "MiniMax-M3"
  minimax_temperature: "0.7"
  minimax_max_tokens: "8000"
  minimax_enable_thinking: "false"
  optimizer_minimax_base_url: ""    # per-role override
  target_minimax_base_url: ""       # per-role override
  optimizer_minimax_api_key: ""
  target_minimax_api_key: ""

train:
  num_epochs: 4
  train_size: 0          # 0 = derive from dataset split when available
  batch_size: 40
  accumulation: 1
  seed: 42
  # Keep train/items.json order instead of the per-epoch shuffle. Used to feed a
  # deliberate evidence stream (task families grouped into regimes) and for the
  # order-sensitivity ablation. true = upstream behaviour.
  shuffle_train_items: true

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 16
  failure_only: false

optimizer:
  learning_rate: 4          # max edits per step (edit_budget)
  min_learning_rate: 2      # min edits for decay schedulers
  lr_scheduler: cosine      # constant / linear / cosine / autonomous
  lr_control_mode: fixed    # fixed / autonomous / none
  skill_update_mode: patch  # patch / rewrite_from_suggestions / full_rewrite_minibatch
  use_slow_update: true
  slow_update_samples: 20
  slow_update_gate_with_selection: false
  longitudinal_pair_policy: mixed  # mixed / changed / unchanged
  use_meta_skill: true
  use_skill_aware_reflection: false  # EmbodiSkill: split failures into SKILL_DEFECT (edit body) vs EXECUTION_LAPSE (protected appendix)
  skill_aware_appendix_source: both  # both = success+failure emit appendix notes; failure_only = only EXECUTION_LAPSE (paper-faithful)
  skill_aware_consolidate_threshold: 0  # 0 = off; >0 = LLM-consolidate the appendix when its note count exceeds N

evaluation:
  use_gate: true
  # gate_mode selects what "is this candidate skill good?" means:
  #   rollout → the paper's held-out regression test: run the candidate on the
  #             selection split, accept only on strict improvement.
  #   judge   → an LLM reads the candidate, the patch that produced it and the
  #             execution evidence that justified it, and rules ACCEPT/REJECT.
  #             No selection rollout per candidate.
  #   greedy  → no gate; every candidate is force-accepted (validation still runs).
  gate_mode: rollout
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

# Judge gate parameters (`evaluation.gate_mode: judge`). The judge reuses the
# optimizer backend and model, so only the decision rule changes — not the
# judge's strength relative to the agent it is judging.
judge:
  max_completion_tokens: 4096
  retries: 2                  # unparseable after N retries → REJECT
  max_evidence_cards: 24      # per-task evidence cards shown to the judge
  evidence_card_chars: 1200   # trajectory excerpt budget per card
  # v1 = judge on plausibility. Measured: 14/14 accepted at confidence=high,
  #      skill grew 6.4x (SearchQA) / 3.9x (ALFWorld); ALFWorld test fell.
  # v2 = states the window's own counts and growth ratio, requires the judge to
  #      name a defect mechanism with an evidence count, an expected direction
  #      and a falsifier, and enforces each of those as a rejection. Still
  #      withholds the held-out selection accuracy.
  prompt_variant: v3
  min_evidence: 2             # independent failing tasks required (v2)
  max_growth_ratio: 1.5       # growth allowed before rules must be tied (v2)
  require_high_confidence: false  # uncalibrated field; gating on it deadlocks (v2)
  # v3 uses bounded existing evidence and a concise net-benefit prediction.
  # Per-candidate audit is forbidden in judge mode; final evaluation is separate.
  full_validation_audit: false
  full_validation_audit_path: ""

# Evidence-triggered skill evolution (ETE).
#   mode: fixed       → original SkillOpt schedule (batch_size*accumulation
#                        tasks per update); the legacy trainer loop, untouched.
#      immediate      → update after EVERY observation batch (m tasks)
#      fixed_k        → update after every K observation batches (K*m tasks);
#                        m=batch_size, K=1 reproduces the original schedule
#      end            → update once per epoch, at the epoch boundary
#      controller     → OURS: the Evolution Controller Agent decides
#                        WAIT/UPDATE from semantic evidence sufficiency
#   observation_batch_size (m): tasks per observation batch. Observation
#     frequency is fixed and fine-grained; evolution frequency is adaptive
#     under `controller` (and fixed under the baseline modes).
#   controller_view: semantic (skill + evidence state + task content +
#     feedback + trajectory) | score (outcome + score only — ablation)
evolution:
  mode: fixed
  observation_batch_size: 4
  fixed_k: 1
  controller_view: semantic
  controller_max_observation_chars: 1200
  controller_max_state_chars: 4000
  controller_max_parse_retries: 2
  # Feed previous attempts + their validation outcomes to the controller. With
  # this off it re-triggers on the same rejected deficiency in a persistent
  # failure regime (measured: 7 attempts vs 5 for a fixed-K baseline).
  controller_attempt_memory: true
  controller_max_completion_tokens: 4096
  max_buffer_observations: 0   # 0 = off; >0 = force an attempt after N buffered observations (safety valve)

env:
  name: ""
  skill_init: ""
  split_mode: ratio       # ratio = build deterministic split from data_path; split_dir = use pre-split train/val/test
  split_seed: 42
  split_dir: ""
  data_path: ""
  split_output_dir: ""
  exec_timeout: 120      # per target model/code-agent call timeout in seconds
  out_root: ""
