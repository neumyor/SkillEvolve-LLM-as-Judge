_base_: default.yaml

# Evidence-triggered skill evolution (ours) on SearchQA.
#
# The Evolution Controller Agent decides WAIT/UPDATE after every
# 4-task observation batch; the SkillOpt optimizer (reflect → aggregate →
# select → update → gate) runs unchanged over whatever evidence has
# accumulated when the controller triggers.
#
# Baselines over the SAME observation stream (same trainer, only the
# policy differs):
#   immediate : --evolution_mode immediate               (update every 4 tasks)
#   fixed_k   : --evolution_mode fixed_k --evolution_fixed_k 10   (every 40 tasks ≈ upstream batch_size=40)
#   end       : --evolution_mode end                     (once per epoch)
#   upstream  : --evolution_mode fixed                   (original schedule)

model:
  reasoning_effort: medium

train:
  train_size: 400
  batch_size: 40          # reference cadence for the edit-budget horizon only;
                          # the optimizer's window is the adaptive evidence buffer
  accumulation: 1

evolution:
  mode: controller
  observation_batch_size: 4
  controller_view: semantic

gradient:
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  learning_rate: 4
  # Constant edit budget: decay schedules assume a fixed step count, which
  # no longer exists under adaptive scheduling. Keep the budget identical
  # across all scheduling conditions for controlled comparisons.
  lr_scheduler: constant

evaluation:
  sel_env_num: 0
  test_env_num: 0

env:
  name: searchqa
  skill_init: skillopt/envs/searchqa/skills/initial.md
  split_mode: split_dir
  split_dir: data/searchqa_split
  data_path: ""
  split_output_dir: ""
  max_turns: 1
  max_completion_tokens: 16384
  workers: 24
  limit: 0
