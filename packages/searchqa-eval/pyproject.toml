[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchqa-eval"
version = "0.1.0"
description = "Unified single-turn SearchQA evaluation harness (SkillOpt / Trace2Skill protocol)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0,<7",
]

[dependency-groups]
materialize = [
    # Only needed for scripts/materialize_split.py (downloads the HF dataset).
    "datasets>=3,<5",
]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/searchqa_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
