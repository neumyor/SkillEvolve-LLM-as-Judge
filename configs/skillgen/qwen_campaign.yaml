# Fixed campaign configuration for the qwen3.7-plus comparison.
# The endpoint and model are still supplied by scripts/run_method.py so this
# file contains no credentials or machine-local paths.
models:
  default: qwen3.7-plus
  baseline_agent: qwen3.7-plus
  baseline_judge: qwen3.7-plus
  induction: qwen3.7-plus
  induction_contextual: qwen3.7-plus
  induction_summary: qwen3.7-plus
  induction_pattern: qwen3.7-plus
  induction_contrastive: qwen3.7-plus
  generation_plan: qwen3.7-plus
  generation_execute: qwen3.7-plus
  refinement: qwen3.7-plus
  verification_agent: qwen3.7-plus
  verification_judge: qwen3.7-plus
  verification_case_analyst: qwen3.7-plus
  verification_revision_synthesiser: qwen3.7-plus

llm:
  temperature: 0.0
  max_tokens: 4096
  max_tokens_generation: 16384

embedding:
  model: local-hashing

clustering:
  method: kmeans
  n_clusters: null
  max_failure_clusters: 8
  max_success_clusters: 8
  min_clusters: 2
  target_cluster_size: 15
  min_cluster_size: 1

induction:
  max_contrastive_pairs: 20

generation:
  use_web_search: false
  max_search_queries: 0
  candidate_output_dir: ./candidates
  generate_scripts: false
  max_failure_clusters_in_prompt: 6
  max_success_clusters_in_prompt: 6
  max_contrastive_pairs_in_prompt: 8

verification_analysis:
  case_analyst_workers: 8
  case_analyst_max_tokens: 2048
  revision_synthesiser_max_tokens: 4096

verification:
  sample_size: 120
  min_sample: 20
  seed: 42
  min_net_gain_abs: 3
  min_net_gain_rel: 0.05

judge:
  enabled: false
  prompt_variant: v1
  retries: 2
  min_evidence: 2
  max_growth_ratio: 1.5
  require_high_confidence: false
  full_validation: false
  full_validation_audit_path: ""

router:
  enabled: false
  model: qwen3.7-plus
  max_workers: 8

pipeline:
  max_refine_rounds: 8
  baseline_runs_per_instance: 1
  max_workers: 8
  artifact_root: ./artifacts/runs

skill_output:
  path: ./skill_output
