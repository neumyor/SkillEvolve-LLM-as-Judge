models:
  default: qwen3.7-plus
  baseline_agent: qwen3.7-plus
  baseline_judge: qwen3.7-plus
  induction: qwen3.7-plus
  induction_contextual: qwen3.7-plus
  induction_summary: qwen3.7-plus
  induction_pattern: qwen3.7-plus
  induction_contrastive: qwen3.7-plus
  generation_plan: qwen3.7-plus
  generation_execute: qwen3.7-plus
  refinement: qwen3.7-plus
  verification_agent: qwen3.7-plus
  verification_judge: qwen3.7-plus
  verification_case_analyst: qwen3.7-plus
  verification_revision_synthesiser: qwen3.7-plus

llm:
  temperature: 0.0
  max_tokens: 512
  max_tokens_generation: 1024

embedding:
  model: local-hashing

clustering:
  method: kmeans
  n_clusters: 1
  max_failure_clusters: 1
  max_success_clusters: 1
  min_clusters: 1
  target_cluster_size: 15
  min_cluster_size: 1

induction:
  max_contrastive_pairs: 2

generation:
  use_web_search: false
  max_search_queries: 0
  candidate_output_dir: ./candidates
  generate_scripts: false
  max_failure_clusters_in_prompt: 2
  max_success_clusters_in_prompt: 2
  max_contrastive_pairs_in_prompt: 2

verification_analysis:
  case_analyst_workers: 1
  case_analyst_max_tokens: 512
  revision_synthesiser_max_tokens: 512

verification:
  sample_size: 2
  min_sample: 1
  seed: 42
  min_net_gain_abs: 1
  min_net_gain_rel: 0.0

judge:
  enabled: false
  prompt_variant: v1
  retries: 1
  min_evidence: 1
  max_growth_ratio: 1.5
  require_high_confidence: false
  full_validation: false

router:
  enabled: false
  model: qwen3.7-plus
  max_workers: 1

pipeline:
  max_refine_rounds: 1
  baseline_runs_per_instance: 1
  max_workers: 1
  artifact_root: ./experiments/judgestudy/skillgen_smoke_runs

skill_output:
  path: ./experiments/judgestudy/skillgen_smoke_skills
